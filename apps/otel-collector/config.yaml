  resourcedetection:
    detectors:
      - env
      - system
      - docker
    timeout: 5s
    override: false

  memory_limiter:
    # 80% of maximum memory up to 2G
    limit_mib: 1500
    # 25% of limit up to 2G
    spike_limit_mib: 512
    check_interval: 5s

  batch:
    timeout: 5s
    send_batch_size: 1000

exporters:
  clickhouse:
    endpoint: tcp://192.168.1.3:9001
    database: default
    username: default
    password: "clickhouse"
    timeout: 5s
    create_schema: true
    # sending_queue:
    #   enabled: true
    #   num_consumers: 10
    #   queue_size: 10000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform, batch]
      exporters: [clickhouse]
