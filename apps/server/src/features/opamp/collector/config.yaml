receivers:
  otlp:
    protocols:
      http:
      grpc:

processors:
  batch: {}

exporters:
  debug:
    verbosity: detailed

extensions:
  health_check: {}
  opamp:
    server:
      http:
        endpoint: http://localhost:5151/v1/opamp  # HTTP
    capabilities:
      reports_effective_config: true
      # reports_own_metrics: true
      # reports_own_logs: true
      reports_health: true
      # accepts_remote_config: true
      # reports_remote_config: true

service:
  extensions: [health_check, opamp]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
