version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: loglog-postgres
    # restart: unless-stopped
    environment:
      POSTGRES_DB: loglog
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
